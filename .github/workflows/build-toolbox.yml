# Build the arcint toolbox images (INVESTIGATION.md §4), live under the
# operator namespace on GHCR so the Pro B60 box can pull and test.
#
# Images produced:
#   ghcr.io/syakyr/arcint-ov:2026.4.0-marfrit-p15   (tier 1, patched OpenVINO)
#   ghcr.io/syakyr/arcint:investigation-<ts>         (tier 2, immutable)
#   ghcr.io/syakyr/arcint:investigation              (tier 2, moving channel)
#
# `latest` is deliberately NOT touched while this is an investigation.
#
# First run must include tier 1 (tiers=all or tiers=ov,arcint) — tier 2
# FROMs the tier-1 image from the registry.
#
# NOTE for the B60 box: GHCR packages are PRIVATE on first push. After the
# first push, set the package visibility to public (package page →
# Package settings → Change visibility), or pull with a PAT that has
# read:packages:
#   echo $PAT | docker login ghcr.io -u syakyr --password-stdin
#
# Gates that run without a GPU: ctest -L unit (inside the tier-2 build)
# and the stub + /props smoke test. Card-requiring acceptance cells stay
# out of CI by design (docs/design-0.3.1-test-ladder.md); the B60 box IS
# the card test.

name: Build arcint toolbox images

"on":
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Comma-separated tiers to build: ov, arcint, or all'
        required: false
        default: all
      channel:
        description: 'Moving channel tag for the engine image'
        required: false
        default: investigation

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Resolve the lowercase namespace AND the tier selection once, in shell,
  # where the evaluation is visible in the log. A previous run skipped
  # tier2 despite tiers=arcint with the equivalent inline expression
  # (run 35829326673; the dispatch inputs are not exposed via the API,
  # so the inline evaluation could not be audited after the fact) —
  # computing the booleans here makes the decision auditable instead of
  # expression-magic.
  ns:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.ns.outputs.owner }}
      build_ts: ${{ steps.ns.outputs.build_ts }}
      build_ov: ${{ steps.tiers.outputs.build_ov }}
      build_arcint: ${{ steps.tiers.outputs.build_arcint }}
    steps:
      - id: ns
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "build_ts=$(date +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - id: tiers
        run: |
          T='${{ github.event.inputs.tiers }}'
          bo=false; ba=false
          case "${T,,}" in
            all) bo=true; ba=true ;;
            *) case "$T" in *ov*) bo=true ;; esac
               case "$T" in *arcint*) ba=true ;; esac ;;
          esac
          echo "raw tiers input: '$T' -> ov=$bo arcint=$ba" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "build_ov=$bo" >> "$GITHUB_OUTPUT"
          echo "build_arcint=$ba" >> "$GITHUB_OUTPUT"

  tier1-openvino:
    needs: ns
    if: needs.ns.outputs.build_ov == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The OpenVINO clone+build is huge; GitHub runners are not.
      # (Cleanup step transposed from kyuz0's workflow for the same reason.)
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          docker builder prune --all --force
          echo "After cleanup:" && df -h /

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build patched OpenVINO base
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ needs.ns.outputs.owner }}/arcint-ov:2026.4.0-marfrit-p15 \
            -f docker/Dockerfile.openvino-patched .

      - name: Push tier 1 (tag carries pin + patch level; immutable by content)
        run: |
          docker push ${{ env.REGISTRY }}/${{ needs.ns.outputs.owner }}/arcint-ov:2026.4.0-marfrit-p15

  tier2-engine:
    needs: [ns, tier1-openvino]
    # always() so a skipped tier1 does not auto-skip this; then gate on
    # the ns-computed booleans and tier1's actual result.
    if: >-
      ${{ always()
          && needs.ns.result == 'success'
          && needs.ns.outputs.build_arcint == 'true'
          && needs.tier1-openvino.result != 'failure'
          && needs.tier1-openvino.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build engine image
        run: |
          docker build \
            --build-arg OV_BASE=${{ env.REGISTRY }}/${{ needs.ns.outputs.owner }}/arcint-ov:2026.4.0-marfrit-p15 \
            --build-arg ARCINT_GIT_SHA=${GITHUB_SHA::12} \
            -t ${{ env.REGISTRY }}/${{ needs.ns.outputs.owner }}/arcint:build-${{ needs.ns.outputs.build_ts }} \
            -f docker/Dockerfile.arcint .

      # The device-free smoke test already ran inside the build (stub +
      # /props). Re-run here against the final image before publishing the
      # channel tag (kyuz0's immutable→channel discipline). Must run INSIDE
      # the container: the stub binds 127.0.0.1 in the container's netns,
      # so a host-side curl has nothing to connect to (measured: run
      # 35830030865, curl (7) after the stub logged 'listening').
      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash ${{ env.REGISTRY }}/${{ needs.ns.outputs.owner }}/arcint:build-${{ needs.ns.outputs.build_ts }} \
            -c '/usr/bin/arcint --stub --port 8090 & S=$!; sleep 2; curl -fsS http://127.0.0.1:8090/props > /dev/null; R=$?; kill $S 2>/dev/null; wait $S 2>/dev/null; exit $R'

      - name: Push immutable + channel tags
        run: |
          IMG=${{ env.REGISTRY }}/${{ needs.ns.outputs.owner }}/arcint
          docker tag "$IMG:build-${{ needs.ns.outputs.build_ts }}" "$IMG:${{ needs.ns.outputs.build_ts }}"
          docker push "$IMG:${{ needs.ns.outputs.build_ts }}"
          docker tag "$IMG:build-${{ needs.ns.outputs.build_ts }}" "$IMG:${{ github.event.inputs.channel }}"
          docker push "$IMG:${{ github.event.inputs.channel }}"
